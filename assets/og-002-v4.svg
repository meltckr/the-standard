  <text x="52" y="284" fill="#080b10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="850" letter-spacing="-2.6">SAY</text>
  <text x="181" y="284" fill="#2563eb" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="850" letter-spacing="-2.6">NEXT</text>
  <text x="52" y="358" fill="#080b10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="850" letter-spacing="-2.6">MATTERS.</text>

  <line x1="54" y1="404" x2="110" y2="404" stroke="#2563eb" stroke-width="5"/>
  <text x="54" y="447" fill="#334155" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="750" letter-spacing=".7">
    <tspan x="54" dy="0">HOW STRONG TEAMS TALK</tspan>
    <tspan x="54" dy="25">UNDER PRESSURE</tspan>
  </text>

  <g filter="url(#cardShadow)">
    <rect x="608" y="86" width="538" height="458" rx="24" fill="#ffffff"/>
    <image href="og-002-background-v3.png" x="608" y="86" width="538" height="458"
