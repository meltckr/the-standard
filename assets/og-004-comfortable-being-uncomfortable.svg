    <text x="53" y="355" fill="#94a3b8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="11" font-weight="800" letter-spacing="2" text-anchor="middle">REST</text>
    <text x="231" y="355" fill="#60a5fa" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="11" font-weight="850" letter-spacing="2" text-anchor="middle">STRETCH</text>
    <text x="397" y="355" fill="#94a3b8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="11" font-weight="800" letter-spacing="2" text-anchor="middle">PANIC</text>
    <text x="226" y="392" fill="#64748b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="10" font-weight="700" letter-spacing="1.7" text-anchor="middle">CHALLENGE →</text>
  </g>

  <g transform="translate(885 26)">
    <image href="avc-logo-horizontal-light.svg" x="0" y="0" width="250" height="47"/>
  </g>

  <text x="54" y="582" fill="#64748b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="700" letter-spacing="2.7">PRIVATE LEADERSHIP SERIES  ·  AUGUST 2026</text>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#0f172a" stroke-opacity=".12"/>
</svg>
