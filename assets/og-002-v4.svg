    <rect x="609" y="87" width="536" height="456" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".88" stroke-width="2"/>
  </g>

  <circle cx="982" cy="423" r="37" fill="none" stroke="#2563eb" stroke-width="5" opacity=".96"/>
  <circle cx="982" cy="423" r="47" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 8" opacity=".80"/>

  <g transform="translate(885 26)">
    <image href="avc-logo-horizontal-light.svg" x="0" y="0" width="250" height="47"/>
